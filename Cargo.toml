[package]
name = "ed318-canada-lab"
version = "0.1.0"
edition = "2021"
description = "Learning-oriented Rust parser and geo-awareness evaluator for ED-318-style RPAS geographical-zone data"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
